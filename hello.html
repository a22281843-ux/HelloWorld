<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, World | Vibe Coding</title>
  <meta name="description" content="간결하고 감각적인 바이브 코딩 Hello World" />

  <!-- Google Fonts (Plus Jakarta Sans & JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(255, 255, 255, 0.2);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --gradient-title: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      --gradient-brand: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 24px;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle Ambient Aurora */
    .ambient-aurora {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(192, 132, 252, 0.05) 50%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    header {
      width: 100%;
      max-width: 720px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      background: #818cf8;
      border-radius: 50%;
      box-shadow: 0 0 10px #818cf8;
    }

    .time-status {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Main Container */
    main {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 36px;
      z-index: 10;
      margin: auto 0;
    }

    /* Hero Text */
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: 100px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-sub);
      letter-spacing: 0.5px;
    }

    .hero-title {
      font-size: clamp(3rem, 7vw, 4.8rem);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1.05;
      background: var(--gradient-title);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      font-size: 1.15rem;
      color: var(--text-sub);
      font-weight: 400;
      line-height: 1.6;
      max-width: 480px;
    }

    /* Minimal Interactive Input */
    .input-wrapper {
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
    }

    .prompt-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px 56px 18px 20px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: all 0.25s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .prompt-input:focus {
      border-color: var(--card-border-hover);
      box-shadow: 0 0 0 1px var(--card-border-hover), 0 10px 30px rgba(0, 0, 0, 0.3);
      background: rgba(255, 255, 255, 0.05);
    }

    .prompt-input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      position: absolute;
      right: 10px;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: var(--text-main);
      color: #090a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .send-btn:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    /* Clean Toast / Feedback Message */
    .status-msg {
      font-size: 0.9rem;
      color: #818cf8;
      font-weight: 500;
      min-height: 24px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .status-msg.show {
      opacity: 1;
    }

    /* Footer */
    footer {
      width: 100%;
      max-width: 720px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      z-index: 10;
    }

    .footer-quote {
      font-style: italic;
    }

    /* Responsive */
    @media (max-width: 600px) {
      body {
        padding: 24px 16px;
      }
      footer {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Subtle background glow -->
  <div class="ambient-aurora"></div>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-dot"></div>
      <span>vibe.dev</span>
    </div>
    <div class="time-status" id="clock">00:00:00</div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="tag">Vibe Coding Era</div>

    <h1 class="hero-title">Hello, World.</h1>

    <p class="hero-desc">
      생각을 코드로, 바이브를 현실로.<br>
      오늘 당신의 상상은 무엇인가요?
    </p>

    <!-- Clean Input -->
    <div class="input-wrapper">
      <input 
        type="text" 
        id="prompt-input" 
        class="prompt-input" 
        placeholder="만들고 싶은 아이디어를 적어보세요..." 
        autocomplete="off"
      />
      <button id="send-btn" class="send-btn" title="실행">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </div>

    <!-- Minimal Feedback -->
    <div id="status-msg" class="status-msg"></div>
  </main>

  <!-- Footer -->
  <footer>
    <span class="footer-quote">"Focus on the flow, AI takes care of the rest."</span>
    <span>Ready to build</span>
  </footer>

  <script>
    // Live Clock
    function updateClock() {
      const now = new Date();
      const timeString = now.toTimeString().split(' ')[0];
      document.getElementById('clock').textContent = timeString;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Clean Interaction Logic
    const promptInput = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');
    const statusMsg = document.getElementById('status-msg');

    const inspirationalReplies = [
      "✨ 훌륭한 아이디어입니다. 지금 바로 만들어볼까요?",
      "🚀 바이브가 흐르고 있습니다. 상상이 코드가 되는 순간입니다.",
      "💡 멋진 시작입니다! 준비되셨다면 언제든 말씀하세요.",
      "⚡ 흐름을 타세요. 완성은 생각보다 가깝습니다."
    ];

    function handleSend() {
      const text = promptInput.value.trim();
      if (!text) {
        promptInput.focus();
        return;
      }

      const randomReply = inspirationalReplies[Math.floor(Math.random() * inspirationalReplies.length)];
      statusMsg.textContent = randomReply;
      statusMsg.classList.add('show');
      promptInput.value = '';

      setTimeout(() => {
        statusMsg.classList.remove('show');
      }, 3500);
    }

    sendBtn.addEventListener('click', handleSend);
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        handleSend();
      }
    });
  </script>
</body>
</html>
